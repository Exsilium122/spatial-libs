name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Verify built packages load and pack correctly
        run: npm run test:dist

      - name: Run tests
        run: npm test

      - name: Publish @spatial-api/core (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi
          if ! npm view @spatial-api/core@$VERSION version &>/dev/null; then
            cd packages/core && npm publish --access public --provenance $TAG_FLAG
          else
            echo "@spatial-api/core@$VERSION is already published, skipping."
          fi

      - name: Publish @spatial-api/crs-transformer (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/crs/package.json').version")
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi
          if ! npm view @spatial-api/crs-transformer@$VERSION version &>/dev/null; then
            cd packages/crs && npm publish --access public --provenance $TAG_FLAG
          else
            echo "@spatial-api/crs-transformer@$VERSION is already published, skipping."
          fi

      - name: Publish @spatial-api/wfs (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/wfs/package.json').version")
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi
          if ! npm view @spatial-api/wfs@$VERSION version &>/dev/null; then
            cd packages/wfs && npm publish --access public --provenance $TAG_FLAG
          else
            echo "@spatial-api/wfs@$VERSION is already published, skipping."
          fi

      - name: Publish @spatial-api/ogc (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/ogc/package.json').version")
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi
          if ! npm view @spatial-api/ogc@$VERSION version &>/dev/null; then
            cd packages/ogc && npm publish --access public --provenance $TAG_FLAG
          else
            echo "@spatial-api/ogc@$VERSION is already published, skipping."
          fi

      - name: Publish @spatial-api/tester (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/tester/package.json').version")
          TAG_FLAG=""
          if [[ "$VERSION" == *"-"* ]]; then
            TAG_FLAG="--tag next"
          fi
          if ! npm view @spatial-api/tester@$VERSION version &>/dev/null; then
            cd packages/tester && npm publish --access public --provenance $TAG_FLAG
          else
            echo "@spatial-api/tester@$VERSION is already published, skipping."
          fi
