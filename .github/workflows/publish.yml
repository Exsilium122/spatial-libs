name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish @spatial-api/wfs (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/wfs/package.json').version")
          if ! npm view @spatial-api/wfs@$VERSION version &>/dev/null; then
            npm publish --workspace=packages/wfs --access public --provenance
          else
            echo "@spatial-api/wfs@$VERSION is already published, skipping."
          fi

      - name: Publish @spatial-api/ogc (if version is new)
        run: |
          VERSION=$(node -p "require('./packages/ogc/package.json').version")
          if ! npm view @spatial-api/ogc@$VERSION version &>/dev/null; then
            npm publish --workspace=packages/ogc --access public --provenance
          else
            echo "@spatial-api/ogc@$VERSION is already published, skipping."
          fi